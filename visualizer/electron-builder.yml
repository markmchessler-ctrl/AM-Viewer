appId: com.dolby.atmos-visualizer
productName: Dolby Atmos Visualizer
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
mac:
  category: public.app-category.music
  target:
    - dmg
    - zip
  darkModeSupport: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Audio
