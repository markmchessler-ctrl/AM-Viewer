appId: com.atmosvisualizer.app
productName: Atmos 3D Visualizer
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - electron/**/*.js
  - package.json
mac:
  category: public.app-category.music
  target:
    - dmg
    - zip
  icon: build/icon.icns
win:
  target:
    - nsis
  icon: build/icon.ico
linux:
  target:
    - AppImage
    - deb
  category: Audio
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
